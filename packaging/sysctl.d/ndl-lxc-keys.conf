# Unprivileged system containers share a host uid map (guest 0 -> 100000).
# Nested Docker/runc create session keyrings against that host uid. Debian's
# default 200 keys per user is exhausted once several containers run engines.
# This is host policy owned by No-DAL, not a guest-writable sysctl.
kernel.keys.maxkeys = 200000
kernel.keys.maxbytes = 2000000
