# SPDX-License-Identifier: Apache-2.0
# Debian installer ISO (install path C). Wraps the same nodal metapackage
# as the one-line bootstrap. After reboot the user opens /setup.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=disk
Bootable=yes
OutputDirectory=out
Output=nodal-debian13-amd64.iso

[Content]
Bootable=yes
Packages=nodal
Hostname=nodal
WithNetwork=yes

[Build]
# Packages come from the signed No-dal repo plus Debian trixie.
# Persistence is systemd-networkd only.
Environment=DEBIAN_FRONTEND=noninteractive
