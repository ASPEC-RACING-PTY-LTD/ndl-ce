<rect width="860" height="316" rx="12" fill="#151821"/>
<rect width="860" height="40" rx="12" fill="#1d212c"/>
<rect y="28" width="860" height="12" fill="#1d212c"/>
<circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
<text x="430" y="25" text-anchor="middle" class="t">nodalctl · No-DAL Community Edition</text>
  <text x="28" y="74" class="l0"><tspan class="p">$</tspan><tspan class="c"> curl -fsSL https://raw.githubusercontent.com/…/get-nodal.sh | sudo sh</tspan></text>
  <text x="28" y="100" class="l1"><tspan class="o">  ✓ nodal installed on Debian 13 · open http://&lt;host&gt;:8080/setup</tspan></text>
  <text x="28" y="126" class="l2"><tspan class="p">$</tspan><tspan class="c"> nodalctl workload create --kind vm --name guest-vm-01 --cpus 2</tspan></text>
  <text x="28" y="152" class="l3"><tspan class="o">  ✓ guest-vm-01 running · KVM/QEMU</tspan></text>
  <text x="28" y="178" class="l4"><tspan class="p">$</tspan><tspan class="c"> nodalctl workload create --kind oci --name redis-cache --image-pin redis:alpine</tspan></text>
  <text x="28" y="204" class="l5"><tspan class="o">  ✓ redis-cache running · containerd</tspan></text>
  <text x="28" y="230" class="l6"><tspan class="p">$</tspan><tspan class="c"> nodalctl backup run --workload web-01 --target r2</tspan></text>
  <text x="28" y="256" class="l7"><tspan class="o">  ✓ restore point sealed · deduplicated, encrypted, uploading to Cloudflare R2</tspan></text>
