syntax = "proto3";

package nodal.agent.v1;

option go_package = "github.com/no-dal/ndl-ce/gen/nodal/agent/v1;agentv1";

// AgentService is the typed southbound RPC. There is no generic host
// command execution. Unknown methods are hard errors.
service AgentService {
  rpc Hello(HelloRequest) returns (HelloResponse);
  rpc Observe(ObserveRequest) returns (ObserveResponse);
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  // Local first-node enroll. Join tokens are empty on a single node.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // OpenSession is reserved for later remote-node sessions.
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  // GetInventory returns the last typed host observation.
  rpc GetInventory(GetInventoryRequest) returns (GetInventoryResponse);
  // GetMetrics returns agent-side SQLite samples. Not stored in PostgreSQL.
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
  // GetStorage observes known Directory pools. It does not delete objects.
  rpc GetStorage(GetStorageRequest) returns (GetStorageResponse);
  // GetNetworks observes known network objects. It does not delete objects.
  rpc GetNetworks(GetNetworksRequest) returns (GetNetworksResponse);
  // GetWorkloads observes known system containers. It does not delete objects.
  rpc GetWorkloads(GetWorkloadsRequest) returns (GetWorkloadsResponse);
  // UploadLibrary streams ISO or cloud-image bytes to the agent.
  rpc UploadLibrary(stream UploadLibraryRequest) returns (UploadLibraryResponse);
  // FilesOp is a typed jail operation. Path is relative to the jail root.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc FilesOp(FilesOpRequest) returns (FilesOpResponse);
  // FilesPut writes one file in chunks beneath the jail.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc FilesPut(stream FilesPutRequest) returns (FilesOpResponse);
  // FilesGet reads one file in chunks beneath the jail.
  rpc FilesGet(FilesGetRequest) returns (stream FilesGetResponse);
  // AttachTerminal is a bidirectional nodal.term.v1 byte stream.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc AttachTerminal(stream TermFrame) returns (stream TermFrame);
}

message HostPlatform {
  string id = 1;
  string version_id = 2;
  string family = 3;
  string architecture = 4;
  string support_tier = 5;
  repeated string capabilities = 6;
}

message HelloRequest {}

message HelloResponse {
  string agent_version = 1;
  HostPlatform host_platform = 2;
  // Feature flags are empty in Phase 0. Add names here later;
  // do not overload HostPlatform.capabilities for CP features.
  repeated string feature_flags = 3;
}

message StoragePoolHint {
  string pool_id = 1;
  string backend_type = 2;
  string root_path = 3;
  bytes backing_json = 4;
}

message NetworkHint {
  string network_id = 1;
  string kind = 2;
  string bridge_name = 3;
  string uplink_ifname = 4;
}

message ObserveRequest {
  repeated StoragePoolHint storage_pools = 1;
  repeated NetworkHint networks = 2;
  repeated WorkloadHint workloads = 3;
}

message ObserveResponse {
  string observed_at = 1;
  string schema_version = 2;
  bytes inventory_json = 3;
  bytes storage_json = 4;
  bytes network_json = 5;
  bytes workload_json = 6;
}

message GetWorkloadsRequest {
  repeated WorkloadHint workloads = 1;
}

message GetWorkloadsResponse {
  bytes workload_json = 1;
}

message GetInventoryRequest {}

message GetInventoryResponse {
  string observed_at = 1;
  string schema_version = 2;
  bytes inventory_json = 3;
}

message GetMetricsRequest {
  string from = 1;
  string to = 2;
}

message GetMetricsResponse {
  string status = 1;
  bytes series_json = 2;
}

message GetStorageRequest {
  repeated StoragePoolHint storage_pools = 1;
}

message GetStorageResponse {
  bytes storage_json = 1;
}

message GetNetworksRequest {
  repeated NetworkHint networks = 1;
}

message GetNetworksResponse {
  bytes network_json = 1;
}

// ExecuteRequest is a typed method table. Add new methods as oneof
// members. Do not add a string command field or a generic exec RPC.
message ExecuteRequest {
  string operation_id = 1;
  oneof method {
    Ping ping = 10;
    CreateDirectoryPool create_directory_pool = 11;
    CreateDirectoryVolume create_directory_volume = 12;
    NetDryRun net_dry_run = 13;
    NetApply net_apply = 14;
    CTCreate ct_create = 15;
    CTLifecycle ct_lifecycle = 16;
    QemuProtoStart qemu_proto_start = 17;
    QemuProtoStop qemu_proto_stop = 18;
    QemuProtoStatus qemu_proto_status = 19;
    VMPrepare vm_prepare = 20;
    VMLifecycle vm_lifecycle = 21;
    VMQueryPCI vm_query_pci = 22;
  }
}

message VMPrepare {
  string workload_id = 1;
  bytes launch_json = 2;
  string user_data = 3;
  string source_path = 4;
  string source_format = 5;
  string dest_path = 6;
  string dest_format = 7;
}

message VMLifecycle {
  string workload_id = 1;
  string action = 2;
  bool autostart = 3;
}

message VMQueryPCI {
  string workload_id = 1;
}

message QemuProtoStart {
  string workload_id = 1;
  string volume_id = 2;
  string disk_path = 3;
  string disk_format = 4;
  int32 cpus = 5;
  int64 memory_bytes = 6;
  string machine = 7;
  string accel = 8;
  bool autostart = 9;
}

message QemuProtoStop {
  string workload_id = 1;
  bool force = 2;
}

message QemuProtoStatus {
  string workload_id = 1;
}

message CTCreate {
  string workload_id = 1;
  string name = 2;
  string image_pin = 3;
  int32 cpus = 4;
  int64 memory_bytes = 5;
  string volume_id = 6;
  string rootfs_path = 7;
  string network_id = 8;
  string bridge_name = 9;
  string mac = 10;
  bool privileged = 11;
  string uid_map = 12;
  string gid_map = 13;
}

message CTLifecycle {
  string workload_id = 1;
  string action = 2;
  string clone_id = 3;
  string clone_volume_id = 4;
  string clone_rootfs_path = 5;
  string clone_mac = 6;
  string clone_name = 7;
}

message WorkloadHint {
  string workload_id = 1;
  string kind = 2;
  string volume_id = 3;
  string network_id = 4;
}

message Ping {}

message CreateDirectoryPool {
  string pool_id = 1;
  string name = 2;
  string root_path = 3;
  bool create = 4;
  repeated string existing_roots = 5;
}

message CreateDirectoryVolume {
  string volume_id = 1;
  string pool_id = 2;
  string root_path = 3;
  string class = 4;
  int64 size_bytes = 5;
  string format = 6;
  bytes backing_json = 7;
}

message NetDryRun {
  string network_id = 1;
  string name = 2;
  string kind = 3;
  string ipv4_cidr = 4;
  bool dhcp = 5;
  bool dns = 6;
  string uplink_ifname = 7;
  string confirm_ifname = 8;
  bytes reservations_json = 9;
}

message NetApply {
  string network_id = 1;
  string name = 2;
  string kind = 3;
  string ipv4_cidr = 4;
  bool dhcp = 5;
  bool dns = 6;
  string uplink_ifname = 7;
  string confirm_ifname = 8;
  bytes reservations_json = 9;
  bool arm_rollback = 10;
}

message ExecuteResponse {
  bool ok = 1;
  string message = 2;
  bytes result_json = 3;
}

message UploadLibraryRequest {
  oneof payload {
    UploadLibraryBegin begin = 1;
    bytes chunk = 2;
    UploadLibraryFinish finish = 3;
  }
}

message UploadLibraryBegin {
  string item_id = 1;
  string pool_id = 2;
  string root_path = 3;
  string kind = 4;
  string display_name = 5;
  int64 max_bytes = 6;
  bytes backing_json = 7;
  repeated string reject_sha256 = 8;
}

message UploadLibraryFinish {
  string expected_sha256 = 1;
}

message UploadLibraryResponse {
  bool ok = 1;
  string message = 2;
  bytes result_json = 3;
}

message EnrollRequest {
  // Empty on the local appliance. Remote join tokens are later phases.
  string join_token = 1;
  string cluster_id = 2;
}

message EnrollResponse {
  string cluster_id = 1;
  string node_id = 2;
  HostPlatform host_platform = 3;
}

message OpenSessionRequest {}

message OpenSessionResponse {}

message FilesOpRequest {
  string target_kind = 1;
  string target_id = 2;
  string jail_root = 3;
  string action = 4;
  string path = 5;
  string dest_path = 6;
  uint32 mode = 7;
}

message FilesOpResponse {
  bool ok = 1;
  string message = 2;
  bytes result_json = 3;
}

message FilesPutRequest {
  oneof payload {
    FilesPutBegin begin = 1;
    bytes chunk = 2;
    FilesPutFinish finish = 3;
  }
}

message FilesPutBegin {
  string target_kind = 1;
  string target_id = 2;
  string jail_root = 3;
  string path = 4;
  int64 max_bytes = 5;
  uint32 mode = 6;
}

message FilesPutFinish {
  string expected_sha256 = 1;
}

message FilesGetRequest {
  string target_kind = 1;
  string target_id = 2;
  string jail_root = 3;
  string path = 4;
}

message FilesGetResponse {
  bytes chunk = 1;
  string sha256 = 2;
}

message TermFrame {
  string target_kind = 1;
  string target_id = 2;
  string jail_root = 3;
  string cwd = 4;
  bytes frame = 5;
}
