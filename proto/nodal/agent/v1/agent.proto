syntax = "proto3";

package nodal.agent.v1;

option go_package = "github.com/no-dal/ndl-ce/gen/nodal/agent/v1;agentv1";

// AgentService is the typed southbound RPC. There is no generic host
// command execution. Unknown methods are hard errors.
service AgentService {
  rpc Hello(HelloRequest) returns (HelloResponse);
  rpc Observe(ObserveRequest) returns (ObserveResponse);
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  // Local first-node enroll. Join tokens are empty on a single node.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // OpenSession is reserved for later remote-node sessions.
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  // GetInventory returns the last typed host observation.
  rpc GetInventory(GetInventoryRequest) returns (GetInventoryResponse);
  // GetMetrics returns agent-side SQLite samples. Not stored in PostgreSQL.
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
  // GetStorage observes known Directory pools. It does not delete objects.
  rpc GetStorage(GetStorageRequest) returns (GetStorageResponse);
  // UploadLibrary streams ISO or cloud-image bytes to the agent.
  rpc UploadLibrary(stream UploadLibraryRequest) returns (UploadLibraryResponse);
}

message HostPlatform {
  string id = 1;
  string version_id = 2;
  string family = 3;
  string architecture = 4;
  string support_tier = 5;
  repeated string capabilities = 6;
}

message HelloRequest {}

message HelloResponse {
  string agent_version = 1;
  HostPlatform host_platform = 2;
  // Feature flags are empty in Phase 0. Add names here later;
  // do not overload HostPlatform.capabilities for CP features.
  repeated string feature_flags = 3;
}

message StoragePoolHint {
  string pool_id = 1;
  string backend_type = 2;
  string root_path = 3;
  bytes backing_json = 4;
}

message ObserveRequest {
  repeated StoragePoolHint storage_pools = 1;
}

message ObserveResponse {
  string observed_at = 1;
  string schema_version = 2;
  bytes inventory_json = 3;
  bytes storage_json = 4;
}

message GetInventoryRequest {}

message GetInventoryResponse {
  string observed_at = 1;
  string schema_version = 2;
  bytes inventory_json = 3;
}

message GetMetricsRequest {
  string from = 1;
  string to = 2;
}

message GetMetricsResponse {
  string status = 1;
  bytes series_json = 2;
}

message GetStorageRequest {
  repeated StoragePoolHint storage_pools = 1;
}

message GetStorageResponse {
  bytes storage_json = 1;
}

// ExecuteRequest is a typed method table. Add new methods as oneof
// members. Do not add a string command field or a generic exec RPC.
message ExecuteRequest {
  string operation_id = 1;
  oneof method {
    Ping ping = 10;
    CreateDirectoryPool create_directory_pool = 11;
    CreateDirectoryVolume create_directory_volume = 12;
  }
}

message Ping {}

message CreateDirectoryPool {
  string pool_id = 1;
  string name = 2;
  string root_path = 3;
  bool create = 4;
  repeated string existing_roots = 5;
}

message CreateDirectoryVolume {
  string volume_id = 1;
  string pool_id = 2;
  string root_path = 3;
  string class = 4;
  int64 size_bytes = 5;
  string format = 6;
  bytes backing_json = 7;
}

message ExecuteResponse {
  bool ok = 1;
  string message = 2;
  bytes result_json = 3;
}

message UploadLibraryRequest {
  oneof payload {
    UploadLibraryBegin begin = 1;
    bytes chunk = 2;
    UploadLibraryFinish finish = 3;
  }
}

message UploadLibraryBegin {
  string item_id = 1;
  string pool_id = 2;
  string root_path = 3;
  string kind = 4;
  string display_name = 5;
  int64 max_bytes = 6;
  bytes backing_json = 7;
  repeated string reject_sha256 = 8;
}

message UploadLibraryFinish {
  string expected_sha256 = 1;
}

message UploadLibraryResponse {
  bool ok = 1;
  string message = 2;
  bytes result_json = 3;
}

message EnrollRequest {
  // Empty on the local appliance. Remote join tokens are later phases.
  string join_token = 1;
  string cluster_id = 2;
}

message EnrollResponse {
  string cluster_id = 1;
  string node_id = 2;
  HostPlatform host_platform = 3;
}

message OpenSessionRequest {}

message OpenSessionResponse {}
