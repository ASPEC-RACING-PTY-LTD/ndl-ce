name: CI

# One quick job that catches broken changes: formatting, vet, types, lint,
# generated code, policy checks and migrations on Postgres. The full Go and UI
# test suites run locally before each push (scripts/check.sh). The Alpha
# Release workflow starts only after this passes.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "24"

jobs:
  check:
    name: Check
    # Runs only on GitHub: the CodeHold mirror's runner skips it.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start Postgres
        # Started first so it is ready by the time migrations are applied.
        run: docker run -d --name pg -e POSTGRES_USER=nodal -e POSTGRES_PASSWORD=nodal -e POSTGRES_DB=nodal -p 5432:5432 postgres:16
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Restore Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI packages
        working-directory: ui
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Policy
        run: |
          node scripts/ci/check-em-dashes.mjs
          node scripts/ci/check-bootstrap-size.mjs
          node scripts/ci/check-package-structure.mjs
          node scripts/ci/check-ci-policy.mjs
          node --test scripts/release-version.test.mjs
          node scripts/ci/check-openapi-routes.mjs
          node scripts/ci/check-ui-copy.mjs
          shellcheck --severity=error packaging/bootstrap/get-nodal.sh \
            packaging/lib/ndl/build-ui.sh \
            packaging/e2e/lib/ensure-node.sh \
            packaging/e2e/check-ui-build.sh \
            packaging/cert/lib.sh \
            packaging/cert/ce-1.0-certify.sh \
            packaging/cert/selftest.sh
      - name: Generated API types
        run: |
          node scripts/generate-openapi.mjs
          git diff --exit-code -- ui/src/generated/openapi.ts
      - name: Go format and vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: UI lint and types
        working-directory: ui
        run: |
          pnpm lint &
          lint=$!
          pnpm typecheck
          wait "$lint"
      - name: Apply migrations
        env:
          NODAL_TEST_PG: postgresql://nodal:nodal@localhost:5432/nodal
        run: |
          for _ in $(seq 1 30); do docker exec pg pg_isready -U nodal >/dev/null 2>&1 && break; sleep 1; done
          go test ./internal/store/ -count=1 -run TestApplyOnPostgres
