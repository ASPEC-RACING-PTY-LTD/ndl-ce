name: Alpha Release

# Runs after CI passes on main. It does not test again: it builds the
# packages, tags the release and publishes it. The full test suites run
# locally before pushing (scripts/check.sh).
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: alpha-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # Builds only on GitHub (the CodeHold mirror's runner skips it), only once
    # CI passed for a push, and only for commits whose message starts with
    # DEPLOY:.
    if: >-
      github.server_url == 'https://github.com' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_commit.message, 'DEPLOY:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Install Debian packaging tools
        # Started in the background; waited for before the packages build.
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends debhelper devscripts dpkg-dev apt-utils fakeroot > "$RUNNER_TEMP/apt.log" 2>&1; echo $? > "$RUNNER_TEMP/apt.status") &
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.event.workflow_run.head_sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Calculate release tag
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for existing_tag in $(git tag --list 'v[0-9]*' --sort=-version:refname); do
            tagged_commit="$(git rev-list -n 1 "$existing_tag")"
            if [ "$(git rev-parse "$tagged_commit^")" = "$HEAD_SHA" ]; then
              echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
              echo "existing=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          tag="$(node scripts/release-version.mjs "$latest_tag" "$COMMIT_MESSAGE")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "existing=false" >> "$GITHUB_OUTPUT"
      - name: Wait for Debian packaging tools
        run: |
          while [ ! -f "$RUNNER_TEMP/apt.status" ]; do sleep 1; done
          if [ "$(cat "$RUNNER_TEMP/apt.status")" != 0 ]; then cat "$RUNNER_TEMP/apt.log"; exit 1; fi
      - name: Test signed APT upgrade path
        run: bash packaging/release/test-apt-upgrade.sh
      - name: Stamp package version and build Debian packages
        env:
          DEBFULLNAME: No-dal
          DEBEMAIL: packaging@no-dal.com
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! head -n 1 packaging/debian/changelog | grep -q ') UNRELEASED;'; then
            echo "Add an UNRELEASED entry describing this release to packaging/debian/changelog before a DEPLOY commit" >&2
            exit 1
          fi
          dch --changelog packaging/debian/changelog \
            --newversion "${TAG#v}" \
            --distribution trixie \
            --urgency medium \
            ""
          cp -a packaging/debian ./debian
          dpkg-buildpackage -us -uc -b -d
          mapfile -t debs < <(find .. -maxdepth 1 -type f -name '*.deb' -print)
          if [ "${#debs[@]}" -eq 0 ]; then
            echo "No Debian packages were produced" >&2
            exit 1
          fi
          printf '%s\n' "${debs[@]}" > "$RUNNER_TEMP/deb-artifacts.txt"
      - name: Commit release version
        id: release_commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
          EXISTING_TAG: ${{ steps.version.outputs.existing }}
          DEPLOY_AUTHOR_NAME: ${{ github.event.workflow_run.head_commit.author.name }}
          DEPLOY_AUTHOR_EMAIL: ${{ github.event.workflow_run.head_commit.author.email }}
        run: |
          if [ "$EXISTING_TAG" = true ]; then
            release_sha="$(git rev-list -n 1 "$TAG")"
          else
            git config user.name "$DEPLOY_AUTHOR_NAME"
            git config user.email "$DEPLOY_AUTHOR_EMAIL"
            git add packaging/debian/changelog
            git commit -m "chore(release): $TAG [skip ci]"
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
            release_sha=$(git rev-parse HEAD)
            if ! git push origin "HEAD:refs/heads/main"; then
              echo "::warning::main moved during the release build, so the $TAG changelog was not pushed to main. Merge the $TAG tag into main to keep the source version in step."
            fi
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      - name: Write release notes
        env:
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          awk 'NR == 1 { next } /^ -- / { exit } { sub(/^  /, ""); print }' packaging/debian/changelog > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "The stamped Debian changelog entry is empty" >&2
            exit 1
          fi
          {
            echo
            echo "Alpha build from commit $RELEASE_SHA. Install support and current limitations are documented at https://github.com/ASPEC-RACING-PTY-LTD/ndl-ce/blob/main/docs/install.md."
          } >> "$notes"
      - name: Import persistent APT signing key
        id: apt-key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "Configure the APT_SIGNING_KEY and APT_SIGNING_KEY_PASSPHRASE repository secrets before releasing." >&2
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/apt-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$APT_SIGNING_KEY" > "$RUNNER_TEMP/apt-signing-key.asc"
          printf '%s' "$APT_SIGNING_KEY_PASSPHRASE" > "$RUNNER_TEMP/apt-signing-passphrase"
          chmod 600 "$RUNNER_TEMP/apt-signing-key.asc" "$RUNNER_TEMP/apt-signing-passphrase"
          gpg --batch --import "$RUNNER_TEMP/apt-signing-key.asc"
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Publish versioned Alpha release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mapfile -t debs < "$RUNNER_TEMP/deb-artifacts.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${debs[@]}" --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" "${debs[@]}" \
              --title "No-DAL CE $TAG (Alpha)" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --prerelease
          fi
      - name: Collect retained package versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_dir="$RUNNER_TEMP/apt-debs"
          mkdir -p "$package_dir"
          mapfile -t current_debs < "$RUNNER_TEMP/deb-artifacts.txt"
          for deb in "${current_debs[@]}"; do cp -n "$deb" "$package_dir/"; done
          # Older releases download in parallel; each lands in its own folder.
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
            xargs -r -P 8 -I{} sh -c 'mkdir -p "$1/$2" && gh release download "$2" --pattern "*.deb" --dir "$1/$2" >/dev/null 2>&1 || true' _ "$RUNNER_TEMP/release-assets" {}
          find "$RUNNER_TEMP/release-assets" -mindepth 2 -maxdepth 2 -type f -name '*.deb' -exec cp -n {} "$package_dir/" \;
          find "$package_dir" -maxdepth 1 -type f -name '*.deb' -print | sort
      - name: Build signed APT site
        env:
          GNUPGHOME: ${{ runner.temp }}/apt-gnupg
          APT_SIGNING_KEY_FINGERPRINT: ${{ steps.apt-key.outputs.fingerprint }}
          APT_SIGNING_KEY_PASSPHRASE_FILE: ${{ runner.temp }}/apt-signing-passphrase
          APT_PAGES_DOMAIN: packages.no-dal.com
        run: bash packaging/release/build-apt-repo.sh "$RUNNER_TEMP/apt-debs" "$RUNNER_TEMP/apt-site"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/apt-site
      - name: Publish signed APT repository
        id: pages
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 10