openapi: 3.1.0
info:
  title: No-dal Community Edition API
  version: 0.1.8
  description: Phase 9 HTTPS certificates plus prior northbound API. Host visibility, Directory storage, safe networking, system containers, Terminal, Files, virtual machines, and TLS settings.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Process health
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /setup/status:
    get:
      operationId: getSetupStatus
      summary: Whether first-run setup is still open
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"
  /setup/claim:
    post:
      operationId: claimSetup
      summary: Claim the one-time setup token and create the first admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupClaimRequest"
      responses:
        "200":
          description: First administrator created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /auth/login:
    post:
      operationId: login
      summary: Create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      responses:
        "204":
          description: Logged out
  /me:
    get:
      operationId: getMe
      summary: Current principal
      responses:
        "200":
          description: Identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /tokens:
    post:
      operationId: createToken
      summary: Create an API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"
  /tokens/revoke:
    post:
      operationId: revokeToken
      summary: Revoke an API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeTokenRequest"
      responses:
        "204":
          description: Revoked
  /nodes:
    get:
      operationId: listNodes
      summary: Local node summary
      responses:
        "200":
          description: Nodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeListResponse"
  /nodes/{id}:
    get:
      operationId: getNode
      summary: One node summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeSummary"
  /nodes/{id}/hardware:
    get:
      operationId: getNodeHardware
      summary: Cached observed hardware
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hardware inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareResponse"
  /nodes/{id}/capabilities:
    get:
      operationId: getNodeCapabilities
      summary: Observed capability flags
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
  /nodes/{id}/metrics:
    get:
      operationId: getNodeMetrics
      summary: Agent SQLite metric samples
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
  /tasks:
    get:
      operationId: listTasks
      summary: Operations and tasks
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
  /events:
    get:
      operationId: listEvents
      summary: Platform events
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
  /events/stream:
    get:
      operationId: streamEvents
      summary: Server-sent platform events
      responses:
        "200":
          description: Event stream
  /storage/pools:
    get:
      operationId: listStoragePools
      summary: List Directory storage pools
      responses:
        "200":
          description: Pools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePoolListResponse"
    post:
      operationId: createStoragePool
      summary: Create a Directory storage pool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoragePoolRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
  /storage/pools/{id}:
    get:
      operationId: getStoragePool
      summary: Get a Directory storage pool
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
  /storage/volumes:
    get:
      operationId: listStorageVolumes
      summary: List volumes
      responses:
        "200":
          description: Volumes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageVolumeListResponse"
    post:
      operationId: createStorageVolume
      summary: Create a volume by UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStorageVolumeRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageVolume"
  /storage/volumes/{id}:
    get:
      operationId: getStorageVolume
      summary: Get a volume by UUID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Volume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageVolume"
  /storage/images:
    get:
      operationId: listStorageImages
      summary: List library items
      responses:
        "200":
          description: Library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageImageListResponse"
    post:
      operationId: uploadStorageImage
      summary: Upload ISO or cloud-image media
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageImage"
  /storage/images/{id}:
    get:
      operationId: getStorageImage
      summary: Get a library item by UUID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageImage"
  /networks:
    get:
      operationId: listNetworks
      summary: List network objects
      responses:
        "200":
          description: Networks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkListResponse"
    post:
      operationId: createNetwork
      summary: Create or dry-run a network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNetworkRequest"
      responses:
        "200":
          description: Dry-run preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkPreview"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "409":
          description: Typed confirmation required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmationRequired"
  /networks/{id}:
    get:
      operationId: getNetwork
      summary: Get a network by UUID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
  /networks/{id}/apply:
    post:
      operationId: applyNetwork
      summary: Apply or dry-run a network
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: dry_run
          in: query
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyNetworkRequest"
      responses:
        "200":
          description: Applied or previewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
  /networks/{id}/reservations:
    get:
      operationId: listNetworkReservations
      summary: List DHCP reservations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reservations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationListResponse"
    post:
      operationId: createNetworkReservation
      summary: Create a DHCP reservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
  /workloads:
    get:
      operationId: listWorkloads
      summary: List system containers
      responses:
        "200":
          description: Workloads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadListResponse"
    post:
      operationId: createWorkload
      summary: Create a system container or VM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkloadRequest"
      responses:
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
  /workloads/{id}:
    get:
      operationId: getWorkload
      summary: Get a workload by UUID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
    patch:
      operationId: updateWorkload
      summary: Edit cpu, memory, or desired power
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkloadRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
    post:
      operationId: updateWorkloadPost
      summary: Edit cpu, memory, or desired power
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkloadRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
  /workloads/{id}/start:
    post:
      operationId: startWorkload
      summary: Start a system container
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
  /workloads/{id}/stop:
    post:
      operationId: stopWorkload
      summary: Stop a system container
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
  /workloads/{id}/restart:
    post:
      operationId: restartWorkload
      summary: Restart a system container
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
  /workloads/{id}/force-stop:
    post:
      operationId: forceStopWorkload
      summary: Force stop a VM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
  /workloads/{id}/delete:
    post:
      operationId: deleteWorkload
      summary: Delete a system container runtime
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
  /workloads/{id}/clone:
    post:
      operationId: cloneWorkload
      summary: Clone a system container
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloneWorkloadRequest"
      responses:
        "201":
          description: Cloned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
  /nodes/{id}/terminal/sessions:
    post:
      operationId: createNodeTerminalSession
      summary: Create an admin-only host terminal ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIOSessionRequest"
      responses:
        "201":
          description: Ticket shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IOSession"
  /workloads/{id}/console/sessions:
    post:
      operationId: createWorkloadConsoleSession
      summary: Issue a ticketed VM console session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIOSessionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IOSession"
  /workloads/{id}/terminal/sessions:
    post:
      operationId: createWorkloadTerminalSession
      summary: Create a CT terminal ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIOSessionRequest"
      responses:
        "201":
          description: Ticket shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IOSession"
  /io/sessions/{id}:
    get:
      operationId: getIOSession
      summary: Get a terminal session without the ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IOSession"
  /io/sessions/{id}/ws:
    get:
      operationId: connectIOSession
      summary: WebSocket proxy for nodal.term.v1. Ticket is X-Nodal-Ticket or ndl.ticket subprotocol
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Switched to WebSocket
  /nodes/{id}/files:
    get:
      operationId: listNodeFiles
      summary: List host files. Admin only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListResponse"
  /nodes/{id}/files/stat:
    get:
      operationId: statNodeFile
      summary: Stat a host path. Admin only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Stat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
  /nodes/{id}/files/download:
    get:
      operationId: downloadNodeFile
      summary: Download a host file. Admin only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Bytes
  /nodes/{id}/files/upload:
    post:
      operationId: uploadNodeFile
      summary: Upload a host file. Admin only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMutationResponse"
  /nodes/{id}/files/mkdir:
    post:
      operationId: mkdirNodeFile
      summary: Create a host directory. Admin only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileMutationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMutationResponse"
  /nodes/{id}/files/delete:
    post:
      operationId: deleteNodeFile
      summary: Delete a host path. Admin only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileMutationRequest"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMutationResponse"
  /nodes/{id}/files/move:
    post:
      operationId: moveNodeFile
      summary: Rename a host path. Admin only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileMutationRequest"
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMutationResponse"
  /workloads/{id}/files:
    get:
      operationId: listWorkloadFiles
      summary: List CT files
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListResponse"
  /workloads/{id}/files/stat:
    get:
      operationId: statWorkloadFile
      summary: Stat a CT path
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Stat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
  /workloads/{id}/files/download:
    get:
      operationId: downloadWorkloadFile
      summary: Download a CT file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Bytes
  /workloads/{id}/files/upload:
    post:
      operationId: uploadWorkloadFile
      summary: Upload a CT file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMutationResponse"
  /workloads/{id}/files/mkdir:
    post:
      operationId: mkdirWorkloadFile
      summary: Create a CT directory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileMutationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMutationResponse"
  /workloads/{id}/files/delete:
    post:
      operationId: deleteWorkloadFile
      summary: Delete a CT path
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileMutationRequest"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMutationResponse"
  /workloads/{id}/files/move:
    post:
      operationId: moveWorkloadFile
      summary: Rename a CT path
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileMutationRequest"
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMutationResponse"
  /lab/qemu-proto:
    get:
      operationId: getLabQemuProto
      summary: Lab QEMU prototype status (admin only)
      responses:
        "200":
          description: Status from store plus last-applied fields. Unit observation is Collecting or Unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabQemuProtoResponse"
        "403":
          description: Forbidden
        "404":
          description: Not started
    post:
      operationId: startLabQemuProto
      summary: Start the lab QEMU prototype (admin only)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartLabQemuProtoRequest"
      responses:
        "200":
          description: Reused existing qemu-proto workload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabQemuProtoResponse"
        "201":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabQemuProtoResponse"
        "403":
          description: Forbidden
  /lab/qemu-proto/stop:
    post:
      operationId: stopLabQemuProto
      summary: Gracefully stop the lab QEMU prototype (admin only)
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabQemuProtoResponse"
        "403":
          description: Forbidden
  /lab/qemu-proto/kill:
    post:
      operationId: killLabQemuProto
      summary: Force-stop the lab QEMU prototype via systemd SIGKILL (admin only)
      responses:
        "200":
          description: Force-stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabQemuProtoResponse"
        "403":
          description: Forbidden
  /certs:
    get:
      operationId: getCerts
      summary: TLS certificate status for the management plane
      responses:
        "200":
          description: Current certificate status. Private keys are never included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateStatus"
        "401":
          description: Unauthenticated
  /certs/generate:
    post:
      operationId: generateCert
      summary: Generate a self-signed management certificate
      parameters:
        - name: X-Nodal-Confirm
          in: header
          required: true
          schema:
            type: string
            enum:
              - enable-tls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCertRequest"
      responses:
        "200":
          description: Generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateStatus"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
  /certs/import:
    post:
      operationId: importCert
      summary: Import a PEM certificate and private key for the management plane
      parameters:
        - name: X-Nodal-Confirm
          in: header
          required: true
          schema:
            type: string
            enum:
              - enable-tls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportCertRequest"
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateStatus"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
  /certs/acme:
    post:
      operationId: acmeCert
      summary: Configure ACME for the management certificate
      parameters:
        - name: X-Nodal-Confirm
          in: header
          required: true
          schema:
            type: string
            enum:
              - enable-tls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcmeCertRequest"
      responses:
        "200":
          description: ACME configuration accepted. Status may be pending or failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateStatus"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
