          required: true
          schema:
            type: string
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStackMemberRequest"
      responses:
        "200":
          description: Updated stack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stack"
        "403":
          description: Privileged requires admin
  /gpus:
    get:
      operationId: listGpus
      summary: List GPUs, IOMMU group members, and assignments. gpu=all is never a valid id.
      responses:
        "200":
          description: GPUs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GPUListResponse"
  /gpus/runtime:
    get:
      operationId: getGpuRuntime
      summary: GPU runtime install status. Debian 13 adapter only.
      responses:
        "200":
          description: Runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GPURuntime"
  /gpus/runtime/install:
    post:
      operationId: installGpuRuntime
      summary: Install GPU userland via typed Debian apt-get. Requires confirm or dry_run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GPUInstallRequest"
      responses:
        "200":
          description: Requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GPUAssignResult"
        "422":
          description: Confirm required
  /gpus/assign:
    post:
      operationId: assignGpu
