      responses:
        "200":
          description: Current certificate status. Private keys are never included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateStatus"
        "401":
          description: Unauthenticated
  /certs/generate:
    post:
      operationId: generateCert
      summary: Generate a self-signed management certificate
      parameters:
        - name: X-Nodal-Confirm
          in: header
          required: true
          schema:
            type: string
            enum:
              - enable-tls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCertRequest"
      responses:
        "200":
          description: Generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateStatus"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
  /certs/import:
    post:
      operationId: importCert
      summary: Import a PEM certificate and private key for the management plane
      parameters:
        - name: X-Nodal-Confirm
          in: header
          required: true
          schema:
            type: string
            enum:
              - enable-tls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportCertRequest"
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateStatus"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
  /certs/acme:
    post:
      operationId: acmeCert
      summary: Configure ACME for the management certificate
      parameters:
        - name: X-Nodal-Confirm
          in: header
          required: true
          schema:
            type: string
            enum:
              - enable-tls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcmeCertRequest"
      responses:
        "200":
          description: ACME configuration accepted. Status may be pending or failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateStatus"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
  /updates:
    get:
      operationId: getUpdates
      summary: Platform update status for this appliance
      responses:
        "200":
          description: Current update channel, packages, and last operation. Host support is reported honestly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        "401":
          description: Unauthenticated
  /updates/check:
    post:
      operationId: checkUpdates
      summary: Dry-run preview of available control-plane package updates
      responses:
        "200":
          description: Update preview. Always dry_run true. Does not apply packages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatePreview"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "422":
          description: Host unsupported or check not possible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /updates/preflight:
    post:
      operationId: preflightUpdates
      summary: Preflight checks before applying a platform update
      responses:
        "200":
          description: Preflight result. Unsupported checks stay honest on non-Debian hosts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatePreflight"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "422":
          description: Host unsupported or preflight not possible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /updates/checkpoint:
    post:
      operationId: checkpointUpdates
      summary: Create a control-plane checkpoint before apply
      responses:
        "200":
          description: Checkpoint result. Status may be succeeded, failed, or unsupported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCheckpoint"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "422":
          description: Host unsupported or checkpoint not possible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /updates/apply:
    post:
      operationId: applyUpdates
      summary: Apply control-plane package updates without stopping guests
      parameters:
        - name: X-Nodal-Confirm
          in: header
          required: true
          description: Required confirmation. Value must be apply-update.
          schema:
            type: string
            enum:
              - apply-update
      responses:
        "200":
          description: Apply operation accepted or completed. Status stays honest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateOperation"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "422":
          description: Confirm header missing, host unsupported, or apply not possible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /updates/rollback:
    post:
      operationId: rollbackUpdates
      summary: Roll back the last control-plane package update
      parameters:
        - name: X-Nodal-Confirm
          in: header
          required: true
          description: Required confirmation. Value must be rollback-update.
          schema:
            type: string
            enum:
              - rollback-update
      responses:
        "200":
          description: Rollback operation accepted or completed. Status stays honest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateOperation"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "422":
          description: Confirm header missing, host unsupported, or rollback not possible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      summary: Complete a TOTP or recovery-code challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
      responses:
        "200":
          description: Session at AAL 2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Invalid challenge
  /mfa:
    get:
      operationId: getMfa
      summary: Current user MFA status
      responses:
        "200":
          description: MFA status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAStatus"
  /mfa/enroll:
    post:
      operationId: enrollMfa
      summary: Start TOTP enrollment
      responses:
        "201":
          description: Secret and recovery codes shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAEnrollResponse"
  /mfa/confirm:
    post:
      operationId: confirmMfa
      summary: Confirm TOTP enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAConfirmRequest"
      responses:
        "200":
          description: MFA enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAStatus"
  /audit:
    get:
      operationId: listAudit
      summary: Audit browser. Requires audit.read.
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
        "403":
          description: Forbidden
  /groups:
    get:
      operationId: listGroups
      summary: List groups
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListResponse"
    post:
      operationId: createGroup
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
  /groups/{id}/members:
    post:
      operationId: addGroupMember
      summary: Add a user to a group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGroupMemberRequest"
      responses:
        "200":
          description: Added
  /groups/{id}/roles:
    post:
      operationId: bindGroupRole
      summary: Bind operator or viewer to a group. Admin cannot be granted through a group.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindGroupRoleRequest"
      responses:
        "200":
          description: Bound
        "403":
          description: Admin role refused
  /service-principals:
    get:
      operationId: listServicePrincipals
      summary: List service principals
      responses:
        "200":
          description: Service principals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePrincipalListResponse"
    post:
      operationId: createServicePrincipal
      summary: Create a service principal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServicePrincipalRequest"
      responses:
        "201":
          description: Token shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePrincipalCreated"
  /storage/zfs:
    get:
      operationId: getZfsRuntime
      summary: ZFS runtime status. Directory remains default. Force import is refused.
      responses:
        "200":
          description: Runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZFSRuntime"
  /storage/zfs/import:
    post:
      operationId: importZfs
      summary: Import a ZFS pool by GUID. zpool import -f is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZFSImportRequest"
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
        "422":
          description: Force import refused
  /storage/zfs/create:
    post:
      operationId: createZfs
      summary: Create a ZFS pool on extra disks. The host root disk is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZFSCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
  /storage/lvm:
    get:
      operationId: getLvmRuntime
      summary: LVM-thin runtime status. Directory remains default. Incremental send is false. vgexport is refused.
      responses:
        "200":
          description: Runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LVMRuntime"
  /storage/lvm/create:
    post:
      operationId: createLvm
      summary: Create an LVM-thin pool on extra disks. The host root disk is refused. vgexport is never issued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LVMCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
  /storage/datastores:
    get:
      operationId: getDatastoreRuntime
      summary: NFS/SMB/iSCSI runtime. Backup destinations remain Phase 11. Incremental send is false.
      responses:
        "200":
          description: Runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatastoreRuntime"
  /storage/nfs:
    post:
      operationId: createNfs
      summary: Add an NFS share as a compute/library pool. Share down stays unavailable; rows remain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NFSCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
  /storage/smb:
    post:
      operationId: createSmb
      summary: Add an SMB share. Password is stored in secrets, never in unit files or list JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SMBCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
  /storage/iscsi:
    post:
      operationId: createIscsi
      summary: Log in to an iSCSI target and use the LUN as a VM disk handle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ISCSICreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
  /registries:
    get:
      operationId: listRegistries
      summary: List OCI registries (never returns passwords)
      responses:
        "200":
          description: Registries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryListResponse"
    post:
      operationId: createRegistry
      summary: Add an OCI registry with optional credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRegistryRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registry"
  /stacks:
    get:
      operationId: listStacks
      summary: List application stacks
      responses:
        "200":
          description: Stacks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackListResponse"
    post:
      operationId: createStack
      summary: Create an empty application stack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStackRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stack"
  /stacks/import:
    post:
      operationId: importStackCompose
      summary: Import Compose YAML into an inspectable No-dal stack (Compose is not runtime SoT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportStackRequest"
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stack"
        "403":
          description: Privileged services require admin; creating named volumes requires storage.volume.create
  /stacks/{id}:
    get:
      operationId: getStack
      summary: Get stack detail with members and workload links
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stack"
    patch:
      operationId: patchStack
      summary: Update stack metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStackRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stack"
    delete:
      operationId: deleteStack
      summary: Delete a stack (does not delete workloads)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
  /stacks/{id}/apply:
    post:
      operationId: applyStack
      summary: Apply stack members as OCI workloads (idempotent; resumes partial apply)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Applied or partial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stack"
  /stacks/{id}/members/{memberId}:
    patch:
      operationId: patchStackMember
      summary: Update an imported stack member as a No-dal object (Compose is not runtime SoT)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStackMemberRequest"
      responses:
        "200":
          description: Updated stack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stack"
        "403":
          description: Privileged requires admin
  /gpus:
    get:
      operationId: listGpus
      summary: List GPUs, IOMMU group members, and assignments. gpu=all is never a valid id.
      responses:
        "200":
          description: GPUs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GPUListResponse"
  /gpus/runtime:
    get:
      operationId: getGpuRuntime
      summary: GPU runtime install status. Debian 13 adapter only.
      responses:
        "200":
          description: Runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GPURuntime"
  /gpus/runtime/install:
    post:
      operationId: installGpuRuntime
      summary: Install GPU userland via typed Debian apt-get. Requires confirm or dry_run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GPUInstallRequest"
      responses:
        "200":
          description: Requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GPUAssignResult"
        "422":
          description: Confirm required
  /gpus/assign:
    post:
      operationId: assignGpu
      summary: Assign a GPU by PCI BDF. ACS override is refused. Two exclusive claims fail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GPUAssignRequest"
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GPUAssignment"
        "400":
          description: gpu=all or invalid id
        "409":
          description: Exclusive claim conflict
        "422":
          description: ACS override, VFIO preconditions, or unsupported mode
  /gpus/unassign:
    post:
      operationId: unassignGpu
      summary: Drop a GPU claim and restore the host driver for VFIO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GPUUnassignRequest"
      responses:
        "200":
          description: Unassigned
  /workloads/{id}/gpus:
    get:
      operationId: listWorkloadGpus
      summary: GPU assignments for one workload
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GPUAssignmentListResponse"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
            - starting
        service:
          type: string
          enum:
            - ndl-control
        setup_open:
          type: boolean
        tls_enabled:
          type: boolean
    SetupStatusResponse:
      type: object
      additionalProperties: false
      required:
        - open
      properties:
        open:
          type: boolean
    SetupClaimRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - username
        - password
      properties:
        token:
          type: string
        username:
          type: string
        password:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    MeResponse:
      type: object
      additionalProperties: false
      required:
        - user_id
        - username
        - roles
        - edition
        - ux_level
        - expert_ack
      properties:
        user_id:
          type: string
        username:
          type: string
        roles:
          type: array
          items:
            type: string
        edition:
          type: string
        cluster_id:
          type: string
        aal:
          type: integer
        mfa_enabled:
          type: boolean
        kind:
          type: string
          enum:
            - person
            - service
        ux_level:
          type: string
          enum:
            - guided
            - advanced
            - expert
        expert_ack:
          type: boolean
        expert_ack_at:
          type: string
    MePatchRequest:
      type: object
      additionalProperties: false
      properties:
        ux_level:
          type: string
          enum:
            - guided
            - advanced
            - expert
        expert_ack:
          type: boolean
    MFAChallengeResponse:
      type: object
      additionalProperties: false
      required:
        - mfa_required
        - mfa_challenge_id
        - mfa_token
      properties:
        mfa_required:
          type: boolean
          enum:
            - true
        mfa_challenge_id:
          type: string
        mfa_token:
          type: string
    CreateTokenRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
          description: Must be a subset of the creator grants. Empty inherits the creator role.
    CreateTokenResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - prefix
        - token
      properties:
        id:
          type: string
        prefix:
          type: string
        token:
          type: string
    RevokeTokenRequest:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
    NodeListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NodeSummary"
    NodeSummary:
      type: object
      additionalProperties: true
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        support_tier:
          type: string
        host_platform:
          type: string
        role:
          type: string
        hostname:
          type: string
        revoked:
          type: boolean
        stale:
          type: boolean
        observed_at:
          type: string
        host_os:
          type: string
        host_id:
          type: string
        host_version_id:
          type: string
        cpu_model:
          type: string
        cpu_sockets:
          type: integer
        cpu_cores:
          type: integer
        cpu_threads:
          type: integer
        memory_bytes:
          type: integer
        disk_count:
          type: integer
        disk_bytes:
          type: integer
        nic_count:
          type: integer
        gpu_count:
          type: integer
        gpu_present:
          type: boolean
    HardwareResponse:
      type: object
      additionalProperties: true
      required:
        - status
      properties:
        node_id:
          type: string
        observed_at:
          type: string
        stale:
          type: boolean
        status:
          type: string
        message:
          type: string
        inventory:
          type: object
          additionalProperties: true
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required:
        - capabilities
      properties:
        node_id:
          type: string
        stale:
          type: boolean
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
    Capability:
      type: object
      additionalProperties: false
      required:
        - id
        - status
      properties:
        id:
          type: string
        status:
          type: string
        detail:
          type: string
    MetricsResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - series
      properties:
        status:
          type: string
        series:
          type: array
          items:
            $ref: "#/components/schemas/MetricSeries"
