      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Snapshot list and capability. Directory system containers return supported=false with an honest reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotListResponse"
        "401":
          description: Unauthenticated
        "404":
          description: Workload not found
    post:
      operationId: createWorkloadSnapshot
      summary: Create a point-in-time snapshot on the same pool
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSnapshotRequest"
      responses:
        "201":
          description: Snapshot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "422":
          description: Snapshots not supported for this workload (for example Directory system containers are not ZFS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
