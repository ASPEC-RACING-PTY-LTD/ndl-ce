openapi: 3.1.0
info:
  title: No-dal Community Edition API
  version: 0.1.0
  description: Phase 3 northbound API. Host visibility plus Directory storage and the image library.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Process health
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /setup/status:
    get:
      operationId: getSetupStatus
      summary: Whether first-run setup is still open
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"
  /setup/claim:
    post:
      operationId: claimSetup
      summary: Claim the one-time setup token and create the first admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupClaimRequest"
      responses:
        "200":
          description: First administrator created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /auth/login:
    post:
      operationId: login
      summary: Create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      responses:
        "204":
          description: Logged out
  /me:
    get:
      operationId: getMe
      summary: Current principal
      responses:
        "200":
          description: Identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /tokens:
    post:
      operationId: createToken
      summary: Create an API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"
  /tokens/revoke:
    post:
      operationId: revokeToken
      summary: Revoke an API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeTokenRequest"
      responses:
        "204":
          description: Revoked
  /nodes:
    get:
      operationId: listNodes
      summary: Local node summary
      responses:
        "200":
          description: Nodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeListResponse"
  /nodes/{id}:
    get:
      operationId: getNode
      summary: One node summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeSummary"
  /nodes/{id}/hardware:
    get:
      operationId: getNodeHardware
      summary: Cached observed hardware
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hardware inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareResponse"
  /nodes/{id}/capabilities:
    get:
      operationId: getNodeCapabilities
      summary: Observed capability flags
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
  /nodes/{id}/metrics:
    get:
      operationId: getNodeMetrics
      summary: Agent SQLite metric samples
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
  /tasks:
    get:
      operationId: listTasks
      summary: Operations and tasks
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
  /events:
    get:
      operationId: listEvents
      summary: Platform events
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
  /events/stream:
    get:
      operationId: streamEvents
      summary: Server-sent platform events
      responses:
        "200":
          description: Event stream
  /storage/pools:
    get:
      operationId: listStoragePools
      summary: List Directory storage pools
      responses:
        "200":
          description: Pools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePoolListResponse"
    post:
      operationId: createStoragePool
      summary: Create a Directory storage pool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoragePoolRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
  /storage/pools/{id}:
    get:
      operationId: getStoragePool
      summary: Get a Directory storage pool
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
  /storage/volumes:
    get:
      operationId: listStorageVolumes
      summary: List volumes
      responses:
        "200":
          description: Volumes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageVolumeListResponse"
    post:
      operationId: createStorageVolume
      summary: Create a volume by UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStorageVolumeRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageVolume"
  /storage/volumes/{id}:
    get:
      operationId: getStorageVolume
      summary: Get a volume by UUID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Volume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageVolume"
  /storage/images:
    get:
      operationId: listStorageImages
      summary: List library items
      responses:
        "200":
          description: Library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageImageListResponse"
    post:
      operationId: uploadStorageImage
      summary: Upload ISO or cloud-image media
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageImage"
  /storage/images/{id}:
    get:
      operationId: getStorageImage
      summary: Get a library item by UUID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageImage"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
            - starting
        service:
          type: string
          enum:
            - ndl-control
        setup_open:
          type: boolean
    SetupStatusResponse:
      type: object
      additionalProperties: false
      required:
        - open
      properties:
        open:
          type: boolean
    SetupClaimRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - username
        - password
      properties:
        token:
          type: string
        username:
          type: string
        password:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    MeResponse:
      type: object
      additionalProperties: false
      required:
        - user_id
        - username
        - roles
        - edition
      properties:
        user_id:
          type: string
        username:
          type: string
        roles:
          type: array
          items:
            type: string
        edition:
          type: string
        cluster_id:
          type: string
    CreateTokenRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
    CreateTokenResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - prefix
        - token
      properties:
        id:
          type: string
        prefix:
          type: string
        token:
          type: string
    RevokeTokenRequest:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
    NodeListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NodeSummary"
    NodeSummary:
      type: object
      additionalProperties: true
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        stale:
          type: boolean
        observed_at:
          type: string
        host_os:
          type: string
        host_id:
          type: string
        host_version_id:
          type: string
        cpu_model:
          type: string
        cpu_sockets:
          type: integer
        cpu_cores:
          type: integer
        cpu_threads:
          type: integer
        memory_bytes:
          type: integer
        disk_count:
          type: integer
        disk_bytes:
          type: integer
        nic_count:
          type: integer
        gpu_count:
          type: integer
        gpu_present:
          type: boolean
    HardwareResponse:
      type: object
      additionalProperties: true
      required:
        - status
      properties:
        node_id:
          type: string
        observed_at:
          type: string
        stale:
          type: boolean
        status:
          type: string
        message:
          type: string
        inventory:
          type: object
          additionalProperties: true
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required:
        - capabilities
      properties:
        node_id:
          type: string
        stale:
          type: boolean
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
    Capability:
      type: object
      additionalProperties: false
      required:
        - id
        - status
      properties:
        id:
          type: string
        status:
          type: string
        detail:
          type: string
    MetricsResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - series
      properties:
        status:
          type: string
        series:
          type: array
          items:
            $ref: "#/components/schemas/MetricSeries"
    MetricSeries:
      type: object
      additionalProperties: false
      required:
        - name
        - status
        - points
      properties:
        name:
          type: string
        status:
          type: string
        unit:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/MetricPoint"
    MetricPoint:
      type: object
      additionalProperties: false
      required:
        - time
        - value
      properties:
        time:
          type: string
        value:
          type: number
    TaskListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskItem"
    TaskItem:
      type: object
      additionalProperties: true
      required:
        - id
        - kind
        - state
      properties:
        id:
          type: string
        kind:
          type: string
        state:
          type: string
        stage:
          type: string
        message:
          type: string
        progress:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
    EventListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventItem"
    EventItem:
      type: object
      additionalProperties: true
      required:
        - id
        - type
        - created_at
      properties:
        id:
          type: string
        type:
          type: string
        node_id:
          type: string
        payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
    StoragePoolListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StoragePool"
        default_path:
          type: string
    StoragePool:
      type: object
      additionalProperties: true
      required:
        - id
        - name
        - backend_type
        - status
      properties:
        id:
          type: string
        name:
          type: string
        backend_type:
          type: string
        status:
          type: string
        locator:
          type: string
        reason:
          type: string
        warnings:
          type: array
          items:
            type: string
        warning_text:
          type: array
          items:
            type: string
        usable_bytes:
          type: integer
        allocated_bytes:
          type: integer
        provisioned_bytes:
          type: integer
    CreateStoragePoolRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        path:
          type: string
        create:
          type: boolean
    StorageVolumeListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StorageVolume"
    StorageVolume:
      type: object
      additionalProperties: true
      required:
        - id
        - pool_id
        - class
      properties:
        id:
          type: string
        pool_id:
          type: string
        class:
          type: string
        backend_ref:
          type: string
        size_bytes:
          type: integer
    CreateStorageVolumeRequest:
      type: object
      additionalProperties: false
      required:
        - pool_id
        - class
        - size_bytes
      properties:
        pool_id:
          type: string
        class:
          type: string
        size_bytes:
          type: integer
        format:
          type: string
    StorageImageListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StorageImage"
    StorageImage:
      type: object
      additionalProperties: true
      required:
        - id
        - kind
      properties:
        id:
          type: string
        kind:
          type: string
        display_name:
          type: string
        checksum_sha256:
          type: string
        size_bytes:
          type: integer
