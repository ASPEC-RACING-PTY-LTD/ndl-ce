          description: Exclusive claim conflict
        "422":
          description: ACS override, VFIO preconditions, or unsupported mode
  /gpus/unassign:
    post:
      operationId: unassignGpu
      summary: Drop a GPU claim and restore the host driver for VFIO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GPUUnassignRequest"
      responses:
        "200":
          description: Unassigned
  /workloads/{id}/gpus:
    get:
      operationId: listWorkloadGpus
      summary: GPU assignments for one workload
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
