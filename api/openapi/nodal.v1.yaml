  /stacks/{id}:
    get:
      operationId: getStack
      summary: Get stack detail with members and workload links
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stack"
    patch:
      operationId: patchStack
      summary: Update stack metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStackRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stack"
    delete:
      operationId: deleteStack
      summary: Delete a stack (does not delete workloads)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
