      operationId: restoreBackupArtifact
      summary: Restore a backup artifact as a new workload or replace an existing one. Dest is target_node_id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Nodal-Confirm
          in: header
          required: false
          description: Required when mode is replace. Value must be restore.
          schema:
            type: string
            enum:
              - restore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreBackupRequest"
      responses:
        "202":
          description: Restore accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRun"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "404":
          description: Artifact not found
        "422":
          description: Confirm header missing for replace, or restore not possible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /backups/artifacts/{id}/verify:
    post:
      operationId: verifyBackupArtifact
      summary: Open-verify an artifact or restore it to an isolated throwaway workload
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyBackupRequest"
      responses:
        "202":
          description: Verify accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupArtifact"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "404":
          description: Artifact not found
        "422":
          description: Verify not possible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /backups/artifacts/{id}/restore-file:
    post:
      operationId: restoreBackupFile
      summary: Extract one guest path from a received backup artifact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreBackupFileRequest"
      responses:
        "200":
          description: Extracted file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreBackupFileResponse"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "404":
          description: Artifact not found
        "422":
          description: Extract unavailable or path invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /certs:
    get:
      operationId: getCerts
      summary: TLS certificate status for the management plane
      responses:
        "200":
          description: Current certificate status. Private keys are never included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateStatus"
        "401":
          description: Unauthenticated
  /certs/generate:
    post:
      operationId: generateCert
      summary: Generate a self-signed management certificate
      parameters:
        - name: X-Nodal-Confirm
          in: header
          required: true
          schema:
            type: string
            enum:
              - enable-tls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCertRequest"
      responses:
        "200":
          description: Generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateStatus"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
  /certs/import:
    post:
      operationId: importCert
      summary: Import a PEM certificate and private key for the management plane
      parameters:
        - name: X-Nodal-Confirm
          in: header
          required: true
          schema:
            type: string
            enum:
              - enable-tls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportCertRequest"
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateStatus"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
  /certs/acme:
    post:
      operationId: acmeCert
      summary: Configure ACME for the management certificate
      parameters:
        - name: X-Nodal-Confirm
          in: header
          required: true
          schema:
            type: string
            enum:
              - enable-tls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcmeCertRequest"
      responses:
        "200":
          description: ACME configuration accepted. Status may be pending or failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateStatus"
        "400":
          description: Directory is not https or includes credentials
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
  /updates:
    get:
      operationId: getUpdates
      summary: Platform update status for this appliance
      responses:
        "200":
          description: Current update channel, packages, and last operation. Host support is reported honestly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        "401":
          description: Unauthenticated
  /updates/check:
    post:
      operationId: checkUpdates
      summary: Dry-run preview of available control-plane package updates
      responses:
        "200":
          description: Update preview. Always dry_run true. Does not apply packages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatePreview"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "422":
          description: Host unsupported or check not possible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /updates/preflight:
    post:
      operationId: preflightUpdates
      summary: Preflight checks before applying a platform update
      responses:
        "200":
          description: Preflight result. Unsupported checks stay honest on non-Debian hosts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatePreflight"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "422":
          description: Host unsupported or preflight not possible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /updates/checkpoint:
    post:
      operationId: checkpointUpdates
      summary: Create a control-plane checkpoint before apply
      responses:
        "200":
          description: Checkpoint result. Status may be succeeded, failed, or unsupported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCheckpoint"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "422":
          description: Host unsupported or checkpoint not possible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /updates/apply:
    post:
      operationId: applyUpdates
      summary: Apply control-plane package updates without stopping guests
      parameters:
        - name: X-Nodal-Confirm
          in: header
          required: true
          description: Required confirmation. Value must be apply-update.
          schema:
            type: string
            enum:
              - apply-update
      responses:
        "200":
          description: Apply operation accepted or completed. Status stays honest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateOperation"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "422":
          description: Confirm header missing, host unsupported, or apply not possible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /updates/rollback:
    post:
      operationId: rollbackUpdates
      summary: Roll back the last control-plane package update
      parameters:
        - name: X-Nodal-Confirm
          in: header
          required: true
          description: Required confirmation. Value must be rollback-update.
          schema:
            type: string
            enum:
              - rollback-update
      responses:
        "200":
          description: Rollback operation accepted or completed. Status stays honest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateOperation"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "422":
          description: Confirm header missing, host unsupported, or rollback not possible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      summary: Complete a TOTP or recovery-code challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
      responses:
        "200":
          description: Session at AAL 2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Invalid challenge
  /mfa:
    get:
      operationId: getMfa
      summary: Current user MFA status
      responses:
        "200":
          description: MFA status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAStatus"
  /mfa/enroll:
    post:
      operationId: enrollMfa
      summary: Start TOTP enrollment
      responses:
        "201":
          description: Secret and recovery codes shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAEnrollResponse"
  /mfa/confirm:
    post:
      operationId: confirmMfa
      summary: Confirm TOTP enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAConfirmRequest"
      responses:
        "200":
          description: MFA enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAStatus"
  /audit:
    get:
      operationId: listAudit
      summary: Audit browser. Requires audit.read.
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
        "403":
          description: Forbidden
  /groups:
    get:
      operationId: listGroups
      summary: List groups
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListResponse"
    post:
      operationId: createGroup
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
  /groups/{id}/members:
    post:
      operationId: addGroupMember
      summary: Add a user to a group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGroupMemberRequest"
      responses:
        "200":
          description: Added
  /groups/{id}/roles:
    post:
      operationId: bindGroupRole
      summary: Bind operator or viewer to a group. Admin cannot be granted through a group.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindGroupRoleRequest"
      responses:
        "200":
          description: Bound
        "403":
          description: Admin role refused
  /service-principals:
    get:
      operationId: listServicePrincipals
      summary: List service principals
      responses:
        "200":
          description: Service principals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePrincipalListResponse"
    post:
      operationId: createServicePrincipal
      summary: Create a service principal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServicePrincipalRequest"
      responses:
        "201":
          description: Token shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePrincipalCreated"
  /secrets/reveal:
    post:
      operationId: revealSecret
      summary: Named secret reveal is not configured. AAL 2 is required. Secrets never appear in list JSON.
      responses:
        "403":
          description: Step-up authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Reveal is not configured for this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityCompletionRefusal"
  /storage/zfs:
    get:
      operationId: getZfsRuntime
      summary: ZFS runtime status. Directory remains default. Force import is refused.
      responses:
        "200":
          description: Runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZFSRuntime"
  /storage/zfs/import:
    post:
      operationId: importZfs
      summary: Import a ZFS pool by GUID. zpool import -f is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZFSImportRequest"
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
        "422":
          description: Force import refused
  /storage/zfs/create:
    post:
      operationId: createZfs
      summary: Create a ZFS pool on extra disks. The host root disk is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZFSCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
  /storage/lvm:
    get:
      operationId: getLvmRuntime
      summary: LVM-thin runtime status. Directory remains default. Incremental send is false. vgexport is refused.
      responses:
        "200":
          description: Runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LVMRuntime"
  /storage/lvm/create:
    post:
      operationId: createLvm
      summary: Create an LVM-thin pool on extra disks. The host root disk is refused. vgexport is never issued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LVMCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
  /storage/datastores:
    get:
      operationId: getDatastoreRuntime
      summary: NFS/SMB/iSCSI runtime. Backup destinations remain Phase 11. Incremental send is false.
      responses:
        "200":
          description: Runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatastoreRuntime"
  /storage/nfs:
    post:
      operationId: createNfs
      summary: Add an NFS share as a compute/library pool. Share down stays unavailable; rows remain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NFSCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
  /storage/smb:
    post:
      operationId: createSmb
      summary: Add an SMB share. Password is stored in secrets, never in unit files or list JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SMBCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
  /storage/iscsi:
    post:
      operationId: createIscsi
      summary: Log in to an iSCSI target and use the LUN as a VM disk handle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ISCSICreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
  /storage/distributed:
    get:
      operationId: getDistributedRuntime
      summary: Distributed storage runtime. Enabling the feature does not start ceph-osd.
      responses:
        "200":
          description: Runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistributedRuntime"
    post:
      operationId: attachDistributed
      summary: Attach an external Ceph/RBD cluster. Keys stay in secrets and are never list JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistributedAttachRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
  /storage/distributed/osds:
    post:
      operationId: createDistributedOsd
      summary: OSD bring-up on an extra disk. Confirm required. Does not start by default with the feature.
      parameters:
        - name: X-Nodal-Confirm
          in: header
          required: true
          schema:
            type: string
            enum:
              - start-ceph-osd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistributedOSDRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistributedOSD"
  /storage/distributed/osds/start:
    post:
      operationId: startDistributedOsd
      summary: Start ceph-osd.target after the feature is enabled. Confirm required. VMs are not started.
      parameters:
        - name: X-Nodal-Confirm
          in: header
          required: true
          schema:
            type: string
            enum:
              - start-ceph-osd
      responses:
        "200":
          description: Runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistributedRuntime"
  /storage/distributed/osds/stop:
    post:
      operationId: stopDistributedOsd
      summary: Stop ceph-osd.target. Virtual machines and system containers are not stopped.
      responses:
        "200":
          description: Runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistributedRuntime"
  /registries:
    get:
      operationId: listRegistries
      summary: List OCI registries (never returns passwords)
      responses:
        "200":
          description: Registries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryListResponse"
    post:
      operationId: createRegistry
      summary: Add an OCI registry with optional credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRegistryRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registry"
  /stacks:
    get:
      operationId: listStacks
      summary: List application stacks
      responses:
        "200":
          description: Stacks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackListResponse"
    post:
      operationId: createStack
      summary: Create an empty application stack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStackRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stack"
  /stacks/import:
    post:
      operationId: importStackCompose
      summary: Import Compose YAML into an inspectable No-dal stack (Compose is not runtime SoT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportStackRequest"
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stack"
        "403":
