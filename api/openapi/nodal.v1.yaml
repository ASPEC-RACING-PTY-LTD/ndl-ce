openapi: 3.1.0
info:
  title: No-dal Community Edition API
  version: 0.1.30
  description: Phase 31 placement and maintenance, plus prior northbound API.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Process health
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /setup/status:
    get:
      operationId: getSetupStatus
      summary: Whether first-run setup is still open
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"
  /setup/claim:
    post:
      operationId: claimSetup
      summary: Claim the one-time setup token and create the first admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupClaimRequest"
      responses:
        "200":
          description: First administrator created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /auth/login:
    post:
      operationId: login
      summary: Create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated or MFA challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MeResponse"
                  - $ref: "#/components/schemas/MFAChallengeResponse"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      responses:
        "204":
          description: Logged out
  /me:
    get:
      operationId: getMe
      summary: Current principal
      responses:
        "200":
          description: Identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
    patch:
      operationId: patchMe
      summary: Update presentation preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MePatchRequest"
      responses:
        "200":
          description: Identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "422":
          description: Expert requires a one-time acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tokens:
    post:
      operationId: createToken
      summary: Create an API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"
  /tokens/revoke:
    post:
      operationId: revokeToken
      summary: Revoke an API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeTokenRequest"
      responses:
        "204":
          description: Revoked
  /nodes:
    get:
      operationId: listNodes
      summary: Local node summary
      responses:
        "200":
          description: Nodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeListResponse"
  /nodes/{id}:
    get:
      operationId: getNode
      summary: One node summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeSummary"
  /nodes/{id}/hardware:
    get:
      operationId: getNodeHardware
      summary: Cached observed hardware
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hardware inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareResponse"
  /nodes/{id}/capabilities:
    get:
      operationId: getNodeCapabilities
      summary: Observed capability flags
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
  /nodes/{id}/metrics:
    get:
      operationId: getNodeMetrics
      summary: Agent SQLite metric samples
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
  /nodes/{id}/logs:
    get:
      operationId: getNodeLogs
      summary: Typed journalctl for allowlisted units
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Log lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponse"
  /nodes/{id}/smart:
    get:
      operationId: getNodeSmart
      summary: Honest SMART status from inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SMART
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartResponse"
  /nodes/{id}/capacity:
    get:
      operationId: getNodeCapacity
      summary: Capacity forecast from storage samples
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapacityResponse"
  /workloads/{id}/logs:
    get:
      operationId: getWorkloadLogs
      summary: Typed journalctl for a workload unit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Log lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponse"
  /timeline:
    get:
      operationId: getTimeline
      summary: Events, tasks, and authorized audit in one window
      responses:
        "200":
          description: Timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineResponse"
  /alerts:
    get:
      operationId: listAlerts
      summary: Alert rules
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"
    post:
      operationId: createAlert
      summary: Create an alert rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
  /alerts/channels:
    get:
      operationId: listAlertChannels
      summary: Notification channels with webhook URLs redacted
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelListResponse"
    post:
      operationId: createAlertChannel
      summary: Create a local webhook or SMTP channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
  /tasks:
    get:
      operationId: listTasks
      summary: Operations and tasks
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
  /events:
    get:
      operationId: listEvents
      summary: Platform events
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
  /events/stream:
    get:
      operationId: streamEvents
      summary: Server-sent platform events
      responses:
        "200":
          description: Event stream
  /storage/pools:
    get:
      operationId: listStoragePools
      summary: List Directory storage pools
      responses:
        "200":
          description: Pools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePoolListResponse"
    post:
      operationId: createStoragePool
      summary: Create a Directory storage pool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoragePoolRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
  /storage/pools/{id}:
    get:
      operationId: getStoragePool
      summary: Get a Directory storage pool
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
  /storage/volumes:
    get:
      operationId: listStorageVolumes
      summary: List volumes
      responses:
        "200":
          description: Volumes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageVolumeListResponse"
    post:
      operationId: createStorageVolume
      summary: Create a volume by UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStorageVolumeRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageVolume"
  /storage/volumes/{id}:
    get:
      operationId: getStorageVolume
      summary: Get a volume by UUID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Volume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageVolume"
  /storage/images:
    get:
      operationId: listStorageImages
      summary: List library items
      responses:
        "200":
          description: Library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageImageListResponse"
    post:
      operationId: uploadStorageImage
      summary: Upload ISO or cloud-image media
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageImage"
  /storage/images/{id}:
    get:
      operationId: getStorageImage
      summary: Get a library item by UUID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageImage"
  /networks:
    get:
      operationId: listNetworks
      summary: List network objects
      responses:
        "200":
          description: Networks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkListResponse"
    post:
      operationId: createNetwork
      summary: Create or dry-run a network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNetworkRequest"
      responses:
        "200":
          description: Dry-run preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkPreview"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "409":
          description: Typed confirmation required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmationRequired"
  /networks/{id}:
    get:
      operationId: getNetwork
      summary: Get a network by UUID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
  /networks/{id}/apply:
    post:
      operationId: applyNetwork
      summary: Apply or dry-run a network
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: dry_run
          in: query
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyNetworkRequest"
      responses:
        "200":
          description: Applied or previewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
  /networks/{id}/reservations:
    get:
      operationId: listNetworkReservations
      summary: List DHCP reservations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reservations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationListResponse"
    post:
      operationId: createNetworkReservation
      summary: Create a DHCP reservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
  /networks/vlans:
    post:
      operationId: createNetworkVlan
      summary: Add a stacked VLAN. Access port on VID 20 is the homelab path. Management NIC requires typed confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VLANCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkVLAN"
  /networks/bonds:
    post:
      operationId: createNetworkBond
      summary: Create an active-backup or LACP bond. Bonding the management NIC requires typed confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BondCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkBond"
  /networks/policies:
    post:
      operationId: createNetworkPolicy
      summary: Create a guest-to-guest bridge policy. Cannot drop management INPUT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkPolicy"
  /networks/policies/{id}/apply:
    post:
      operationId: applyNetworkPolicy
      summary: Apply a guest-to-guest policy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkPolicy"
  /networks/overlays:
    post:
      operationId: createNetworkOverlay
      summary: Local VXLAN prep. Multi-node mesh is Phase 30.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverlayCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkOverlay"
  /cluster/wg:
    get:
      operationId: listWireGuard
      summary: Pre-join WireGuard peers. Pairing tokens are not join tokens.
      responses:
        "200":
          description: Peers and remote workers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WGStatusResponse"
  /cluster/wg/peers:
    post:
      operationId: createWireGuardPeer
      summary: Create a local plus worker WireGuard pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WGPeerCreateRequest"
      responses:
        "201":
          description: Created. worker_private_key and pairing_token are shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WGPeerCreateResponse"
  /cluster/sessions:
    post:
      operationId: openClusterSession
      summary: Agent OpenSession dial-out. Pairing token authenticates. Not a join token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenClusterSessionRequest"
      responses:
        "200":
          description: Session accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenClusterSessionResponse"
  /cluster:
    get:
      operationId: getCluster
      summary: Cluster inventory. Hostname is a locator; identity is the node UUID.
      responses:
        "200":
          description: Cluster members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterInventoryResponse"
  /cluster/join-tokens:
    post:
      operationId: createJoinToken
      summary: Create a single-use cluster join token. Shown once.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinTokenCreateRequest"
      responses:
        "201":
          description: Token shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinTokenCreateResponse"
  /cluster/join:
    post:
      operationId: joinCluster
      summary: Join as a worker using a single-use join token. No user session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterJoinRequest"
      responses:
        "201":
          description: Worker enrolled. node_key is shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterJoinResponse"
  /cluster/nodes/{id}/revoke:
    post:
      operationId: revokeClusterNode
      summary: Revoke a worker node. The control node cannot be revoked.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterNodeRevokeResponse"
  /placement/preview:
    post:
      operationId: previewPlacement
      summary: Preview the node a create would land on. Does not start a guest.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacementPreviewRequest"
      responses:
        "200":
          description: Chosen node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementPreviewResponse"
  /node-groups:
    get:
      operationId: listNodeGroups
      summary: List CE placement groups
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeGroupListResponse"
    post:
      operationId: createNodeGroup
      summary: Create a placement group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeGroupCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeGroup"
  /nodes/{id}/maintain:
    post:
      operationId: maintainNode
      summary: Drain a node. Lists workloads and queues migrate jobs. Migrate engine is Phase 32.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Maintenance started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeMaintainResponse"
  /nodes/{id}/maintain/exit:
    post:
      operationId: exitNodeMaintenance
      summary: Clear maintenance mode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Maintenance cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeMaintainExitResponse"
  /workloads:
    get:
      operationId: listWorkloads
      summary: List system containers
      responses:
        "200":
          description: Workloads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadListResponse"
    post:
      operationId: createWorkload
      summary: Create a system container, OCI application, or VM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkloadRequest"
      responses:
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
  /workloads/{id}:
    get:
      operationId: getWorkload
      summary: Get a workload by UUID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
    patch:
      operationId: updateWorkload
      summary: Edit cpu, memory, or desired power
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkloadRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
    post:
      operationId: updateWorkloadPost
      summary: Edit cpu, memory, or desired power
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkloadRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
  /workloads/{id}/guest:
    get:
      operationId: getWorkloadGuest
      summary: qemu-ga and nodal_ga status for a VM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Honest guest agent states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadGuestResponse"
  /workloads/{id}/start:
    post:
      operationId: startWorkload
      summary: Start a system container
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
  /workloads/{id}/stop:
    post:
      operationId: stopWorkload
      summary: Stop a system container
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
  /workloads/{id}/restart:
    post:
      operationId: restartWorkload
      summary: Restart a system container
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
  /workloads/{id}/force-stop:
    post:
      operationId: forceStopWorkload
      summary: Force stop a VM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
  /workloads/{id}/delete:
